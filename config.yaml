embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  # How the QUESTION is embedded at runtime. "local" loads sentence-transformers
  # (desktop/server). "hf-inference" calls the same model id over HTTP (Vercel).
  query_provider: local
  hf_endpoint: https://router.huggingface.co/hf-inference/models/{model}

vectorstore:
  engine: chroma
  persist_path: data/chroma
  collection: hdfc_facts

llm:
  provider: groq

